name: Cardshow missing cards - Tradera auctions one-shot

on:
  push:
    branches: [cardshow-tradera-2026-11-09]
    paths:
      - ".github/workflows/tradera_cardshow_auction_scan.yml"
      - "tradera_cardshow_auction_scan.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradera-cardshow-nov-2026-once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install HTTP client
        run: python -m pip install -q requests
      - name: Verify code syntax, snapshot and existing price classification tests
        run: |
          python -m py_compile tradera_cardshow_auction_scan.py tradera_ruby_match_manual.py
          python - <<'PY'
          import json
          from tradera_ruby_match_manual import listing_pricing
          x=json.load(open("tradera_cardshow_missing_20261109.json",encoding="utf8"))
          assert len(x["missing_items"]) == 144
          assert listing_pricing({"itemType":1,"nextBid":21,"buyItNowPrice":0})["listing_type"] == "Ren auktion"
          assert listing_pricing({"itemType":3,"nextBid":21,"buyItNowPrice":75})["listing_type"] == "Fast pris"
          print("Snapshot and auction classification: OK")
          PY
      - name: Run Tradera official API search and seller expansion
        run: python tradera_cardshow_auction_scan.py
      - name: Upload results for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardshow-tradera-auctions-2026-11-09
          path: tradera_cardshow_auction_results.json
          if-no-files-found: ignore
          retention-days: 7