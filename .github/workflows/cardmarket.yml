name: Card Market Watch

on:
  schedule:
    # GitHub cron uses UTC. Running at both 06:15 and 07:15 UTC keeps the
    # existing Europe/Copenhagen 08:00 gate correct across summer/winter time.
    # The watcher itself exits before 08:00 local time and after today's run,
    # so only one API-backed Cardmarket scan is performed per day.
    - cron: "15 6,7 * * *"
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Send kun en sikker Discord-test uden Cardmarket API-kald"
        required: false
        default: false
        type: boolean
      personal_shadow:
        description: "Kør kun collection-aware Singles radar uden Cardmarket API-kald"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pokemon-cardmarket-watch
  cancel-in-progress: false

jobs:
  cardmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Cardmarket watcher
        run: |
          python -m py_compile cardmarket_chase_watch.py cardmarket_feasibility.py personal/singles_opportunity.py personal/singles_v54.py personal/singles_v55.py personal/singles_v56.py personal/singles_discord_notify.py personal/singles_collection_runner.py personal/singles_collection_runner_v54.py personal/singles_collection_runner_v55.py personal/singles_collection_runner_v56.py personal/cardmarket_link_overlay.py personal/cardmarket_official_listing_probe.py
          if [ -f cardmarket_v16_replay.py ]; then
            python -m py_compile cardmarket_v16_replay.py
          fi
          python -m unittest test_cardmarket_feasibility.py test_singles_opportunity.py test_singles_v54.py test_singles_v55.py test_singles_v56.py test_singles_discord_notify.py test_cardmarket_official_listing_probe.py test_collection_integration.py test_cardmarket_link_overlay.py
          python -m personal.singles_collection_runner_v56 --help >/dev/null
          python -m personal.singles_discord_notify --help >/dev/null
          python -m personal.cardmarket_link_overlay --help >/dev/null

      - name: Test Cardmarket Discord webhook
        if: ${{ inputs.test_webhook == true }}
        env:
          CARDMARKET_WEBHOOK_URL: ${{ secrets.CARDMARKET_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ.get("CARDMARKET_WEBHOOK_URL", "").strip()
          if not webhook:
              raise RuntimeError("CARDMARKET_WEBHOOK_URL mangler")

          payload = {
              "username": "MasterBot",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": "✅ Cardmarket webhook virker",
                      "description": (
                          "Kanalen er forbundet korrekt. Denne test bruger "
                          "ingen Cardmarket API-kald."
                      ),
                      "color": 0x57F287,
                      "footer": {"text": "MasterBot · Card Market Watch"},
                  }
              ],
          }
          response = requests.post(webhook, json=payload, timeout=30)
          response.raise_for_status()
          print("CARD MARKET: Discord webhook test OK")
          PY

      - name: Run daily Card Market backend
        if: ${{ inputs.test_webhook != true && inputs.personal_shadow != true }}
        env:
          TCG_CARDMARKET_API_KEY: ${{ secrets.TCG_CARDMARKET_API_KEY }}
          # Deliberately no CARDMARKET_WEBHOOK_URL here. The broad market/heat
          # scanner remains backend data only; Discord is reserved for the
          # collection-aware personal singles deltas below.
          CARDMARKET_TIMEZONE: "Europe/Copenhagen"
          CARDMARKET_DAILY_HOUR: "8"
          CARDMARKET_MAX_DAILY_REQUESTS: "98"
          CARDMARKET_ROTATION_DAYS: "3"
          CARDMARKET_FORCE_RUN: "0"
        run: |
          if [ -f cardmarket_v16_replay.py ]; then
            python cardmarket_v16_replay.py
          fi
          python cardmarket_chase_watch.py

      - name: Run V56 listing-aware personal singles radar
        if: ${{ inputs.test_webhook != true }}
        run: |
          LINKED_COLLECTION="$RUNNER_TEMP/personal_collection_linked.json"
          python -m personal.cardmarket_link_overlay --output "$LINKED_COLLECTION"
          python -m personal.singles_collection_runner_v56 \
            --collection "$LINKED_COLLECTION" \
            --output "$RUNNER_TEMP/personal_singles_listing_report.md" \
            --limit 10

      - name: Send V56.1 personal singles Discord deltas
        if: ${{ inputs.test_webhook != true && inputs.personal_shadow != true }}
        env:
          CARDMARKET_WEBHOOK_URL: ${{ secrets.CARDMARKET_WEBHOOK_URL }}
        run: |
          python -m personal.singles_discord_notify \
            --collection "$RUNNER_TEMP/personal_collection_linked.json" \
            --limit 5 \
            --require-webhook

      - name: Save Cardmarket and singles alert state
        if: ${{ inputs.test_webhook != true && inputs.personal_shadow != true }}
        run: |
          if [ ! -f cardmarket_chase_state.json ]; then
            echo "No Cardmarket state produced."
            exit 1
          fi
          if [ ! -f personal/personal_singles_discord_state.json ]; then
            echo "No personal singles Discord state produced."
            exit 1
          fi

          if git diff --quiet -- cardmarket_chase_state.json personal/personal_singles_discord_state.json; then
            echo "No Cardmarket or singles alert state changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_BACKUP="$(mktemp -d)"
          cp cardmarket_chase_state.json "$STATE_BACKUP/cardmarket_chase_state.json"
          cp personal/personal_singles_discord_state.json "$STATE_BACKUP/personal_singles_discord_state.json"

          for attempt in 1 2 3 4 5; do
            echo "Cardmarket/singles state push attempt $attempt/5"

            git fetch origin main
            git reset --hard origin/main
            cp "$STATE_BACKUP/cardmarket_chase_state.json" cardmarket_chase_state.json
            cp "$STATE_BACKUP/personal_singles_discord_state.json" personal/personal_singles_discord_state.json
            git add cardmarket_chase_state.json personal/personal_singles_discord_state.json

            if git diff --cached --quiet; then
              echo "Cardmarket and singles alert state already current on main."
              rm -rf "$STATE_BACKUP"
              exit 0
            fi

            git commit -m "Update Cardmarket and singles alert state"

            if git push origin HEAD:main; then
              echo "Cardmarket and singles alert state pushed successfully."
              rm -rf "$STATE_BACKUP"
              exit 0
            fi

            echo "Push raced with another workflow; retrying from latest main."
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done

          rm -rf "$STATE_BACKUP"
          echo "Failed to push Cardmarket/singles state after 5 fresh-main attempts."
          exit 1
