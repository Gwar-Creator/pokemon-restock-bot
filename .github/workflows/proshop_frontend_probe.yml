name: Proshop Frontend Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "proshop_frontend_probe.py"
      - ".github/workflows/proshop_frontend_probe.yml"
      - "restock_bot_github.py"

permissions:
  contents: read

concurrency:
  group: proshop-frontend-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate probe
        run: python -m py_compile proshop_frontend_probe.py

      - name: Run Proshop frontend probe
        run: python proshop_frontend_probe.py
