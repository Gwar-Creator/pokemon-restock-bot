name: Family Watch Email Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-watch-email-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Family Watch email digest dry-run
        env:
          FAMILY_WATCH_EMAIL_DRY_RUN: "1"
          FAMILY_WATCH_SMTP_PORT: "587"
        run: python family_watch_email_digest.py
