name: Tradera Ruby missing cards - read-only test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradera_ruby_match_manual.yml"

permissions:
  contents: read

concurrency:
  group: tradera-ruby-readonly-once
  cancel-in-progress: false

jobs:
  match-active-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install read-only HTTP client
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Validate matcher syntax
        run: python -m py_compile tradera_ruby_match_manual.py
      - name: Check active Ruby and Sapphire auctions
        run: python tradera_ruby_match_manual.py
      - name: Upload findings for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradera-ruby-active-ads-results
          path: tradera_ruby_match_results.json
          if-no-files-found: ignore
          retention-days: 7
