name: Restock V2 CI

on:
  pull_request:
    paths:
      - "restock_bot_github.py"
      - "vintage_finder_tradera.py"
      - "vintage_tradera_quality.py"
      - "vintage_lot_budget.py"
      - "test_vintage_lot_budget.py"
      - "vintage_tradera_item_probe.py"
      - "test_vintage_tradera_item_probe.py"
      - ".github/workflows/tradera_item_detail_probe.yml"
      - "test_vintage_tradera_quality.py"
      - ".github/workflows/tradera_quality.yml"
      - "vintage_marketplace_shortlist.py"
      - "test_vintage_marketplace_shortlist.py"
      - "vintage_marketplace_live.py"
      - "test_vintage_marketplace_live.py"
      - ".github/workflows/vintage_marketplace_live.yml"
      - "vintage_marketplace_state_v1.json"
      - "vintage_marketplace_runner.py"
      - "vintage_marketplace_webhook_check.py"
      - "test_vintage_marketplace_webhook_check.py"
      - ".github/workflows/vintage_marketplace_verify.yml"
      - "test_vintage_marketplace_runner.py"
      - ".github/workflows/vintage_shortlist_review.yml"
      - "vintage_marketplace_discord.py"
      - "test_vintage_marketplace_discord.py"
      - "vintage_tradera_probe.py"
      - "test_vintage_tradera_probe.py"
      - ".github/workflows/tradera_probe.yml"
      - "test_vintage_finder_tradera.py"
      - "test_price_discord_pause.py"
      - "test_pokemon_only_alerts.py"
      - "test_price_watch_focus_threshold.py"
      - "price_watch_lorcana_shadow.py"
      - "test_price_watch_lorcana_shadow.py"
      - "discord_alert_v2.py"
      - "discord_v2_hot_adapter.py"
      - "discord_v2_salling_adapter.py"
      - "test_discord_v2_salling_adapter.py"
      - "salling_early_radar.py"
      - "test_discord_v2_hot_adapter.py"
      - "test_discord_alert_v2.py"
      - "local_stock_watch.py"
      - "hidden_stock_watch.py"
      - "test_hidden_stock_watch.py"
      - "alert_policy.py"
      - "restock_v2_runner.py"
      - "restock_lane_runner.py"
      - "faraos_parser_v2.py"
      - "tier_b_wave1_sources.py"
      - "tier_b_wave1_shadow.py"
      - "tier_b_wave2_sources.py"
      - "tier_b_wave2_shadow.py"
      - "tier_b_wave3_sources.py"
      - "tier_b_wave3_shadow.py"
      - "tier_b_wave4_shadow.py"
      - "indeks_retail_shadow.py"
      - "flinamania_product_probe.py"
      - "hot_restock.py"
      - "proshop_reader_v2.py"
      - "test_proshop_reader_v2.py"
      - "test_proshop_main_health_v2.py"
      - "scanner_health_audit.py"
      - "hot_restock_v4.py"
      - "test_hot_proshop_noise.py"
      - "state_commit_guard.py"
      - "test_alert_policy.py"
      - "test_alert_policy_v2.py"
      - "test_restock_v2_runner.py"
      - "test_restock_lane_ownership.py"
      - "test_faraos_parser_v2.py"
      - "test_tier_b_wave1.py"
      - "test_tier_b_wave1_live.py"
      - "test_tier_b_wave2.py"
      - "test_tier_b_wave3.py"
      - "test_tier_b_wave4.py"
      - "test_indeks_retail_shadow.py"
      - "test_flinamania_product_probe.py"
      - "test_state_commit_guard.py"
      - ".github/workflows/restock.yml"
      - ".github/workflows/hot_restock.yml"
      - ".github/workflows/restock_v2_ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: https://example.invalid/webhook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile changed scanner modules
        run: python -m py_compile restock_bot_github.py local_stock_watch.py alert_policy.py restock_v2_runner.py restock_lane_runner.py faraos_parser_v2.py tier_b_wave1_sources.py tier_b_wave1_shadow.py tier_b_wave2_sources.py tier_b_wave2_shadow.py tier_b_wave3_sources.py tier_b_wave3_shadow.py tier_b_wave4_shadow.py indeks_retail_shadow.py flinamania_product_probe.py hot_restock.py hot_restock_v4.py hidden_stock_watch.py test_hidden_stock_watch.py state_commit_guard.py

      - name: Verify Discord V2 renderer and statuses (no live alerts)
        run: |
          python -m py_compile discord_alert_v2.py test_discord_alert_v2.py discord_v2_hot_adapter.py test_discord_v2_hot_adapter.py discord_v2_salling_adapter.py test_discord_v2_salling_adapter.py
          python -m unittest test_discord_alert_v2.py test_discord_v2_hot_adapter.py test_discord_v2_salling_adapter.py

      - name: Audit Lorcana Price Watch in read-only mode
        run: |
          python -m py_compile price_watch_lorcana_shadow.py test_price_watch_lorcana_shadow.py
          python -m unittest test_price_watch_lorcana_shadow.py

      - name: Test Pokémon-only notification policy
        run: python -m unittest test_pokemon_only_alerts.py

      - name: Test quiet Price Watch and History Discord policy
        run: python -m unittest test_price_discord_pause.py

      - name: Verify read-only Tradera schema probe locally (no network)
        run: |
          python -m py_compile vintage_tradera_probe.py test_vintage_tradera_probe.py
          python -m unittest test_vintage_tradera_probe.py

      - name: Check existing marketplace-deals Discord embed draft (no posting)
        run: |
          python -m py_compile vintage_marketplace_discord.py test_vintage_marketplace_discord.py
          python -m unittest test_vintage_marketplace_discord.py

      - name: Test read-only Vintage Finder preview (no API call or Discord)
        run: |
          python -m py_compile vintage_finder_tradera.py test_vintage_finder_tradera.py
          python -m unittest test_vintage_finder_tradera.py
          python vintage_finder_tradera.py

      - name: Test read-only Tradera quality and BUY/BYD gate (no API/Discord)
        run: |
          python -m py_compile vintage_tradera_quality.py test_vintage_tradera_quality.py
          python -m unittest -q test_vintage_tradera_quality.py

      - name: Test read-only Tradera item detail schema probe
        run: |
          python -m py_compile vintage_tradera_item_probe.py test_vintage_tradera_item_probe.py
          python -m unittest -q test_vintage_tradera_item_probe.py

      - name: Test conservative vintage manual budget worksheet (offline only)
        run: |
          python -m py_compile vintage_lot_budget.py test_vintage_lot_budget.py
          python -m unittest -q test_vintage_lot_budget.py

      - name: Test vintage shortlist and no-send runner
        run: |
          python -m py_compile vintage_marketplace_shortlist.py vintage_marketplace_runner.py test_vintage_marketplace_shortlist.py test_vintage_marketplace_runner.py
          python -m unittest -q test_vintage_marketplace_shortlist.py test_vintage_marketplace_runner.py

      - name: Verify marketplace webhook is strictly read-only
        run: |
          python -m py_compile vintage_marketplace_webhook_check.py test_vintage_marketplace_webhook_check.py
          python -m unittest -q test_vintage_marketplace_webhook_check.py

      - name: Test Vintage Finder Light release gates (mocked, no Discord)
        run: |
          python -m py_compile vintage_marketplace_live.py test_vintage_marketplace_live.py
          python -m unittest -q test_vintage_marketplace_live.py

      - name: Test focused Price Watch minimum alert thresholds
        run: python -m unittest test_price_watch_focus_threshold.py

      - name: Test legacy alert policy compatibility
        run: timeout 60s python -m unittest test_alert_policy.py

      - name: Test Restock V2 policy
        run: timeout 60s python -m unittest test_alert_policy_v2.py

      - name: Test Restock V2 channel routing
        run: timeout 60s python -m unittest test_restock_v2_runner.py

      - name: Test Restock lane ownership
        run: timeout 60s python -m unittest test_restock_lane_ownership.py

      - name: Test hidden stock cooldown and debouncing
        run: timeout 60s python -m unittest test_hidden_stock_watch.py

      - name: Test Proshop Reader and main source-health regression
        run: python -m unittest -v test_proshop_reader_v2.py test_proshop_main_health_v2.py

      - name: Test Proshop repeated-alert guard
        run: timeout 60s python -m unittest test_hot_proshop_noise.py

      - name: Test Faraos parser V2
        run: timeout 60s python -m unittest test_faraos_parser_v2.py

      - name: Test Tier B Wave 1 source health
        run: timeout 60s python -m unittest test_tier_b_wave1.py

      - name: Test Wave 1 specialty routing
        run: timeout 60s python -m unittest test_tier_b_wave1_live.py

      - name: Test Wave 2 specialty scanner
        run: timeout 60s python -m unittest test_tier_b_wave2.py

      - name: Test Wave 3 specialty scanner
        run: timeout 60s python -m unittest test_tier_b_wave3.py

      - name: Test Wave 4 specialty routing
        run: timeout 60s python -m unittest test_tier_b_wave4.py

      - name: Test Indeks Retail backup scanner
        run: timeout 60s python -m unittest test_indeks_retail_shadow.py

      - name: Test dormant Flinamania product probe
        run: timeout 60s python -m unittest test_flinamania_product_probe.py

      - name: Test Matraws single guard
        run: timeout 60s python -m unittest test_matraws_single_guard.py

      - name: Test state commit guard
        run: timeout 60s python -m unittest test_state_commit_guard.py
