name: Restock V2 CI

on:
  pull_request:
    paths:
      - "alert_policy.py"
      - "restock_v2_runner.py"
      - "restock_lane_runner.py"
      - "faraos_parser_v2.py"
      - "tier_b_wave1_sources.py"
      - "tier_b_wave1_shadow.py"
      - "tier_b_wave2_sources.py"
      - "tier_b_wave2_shadow.py"
      - "tier_b_wave3_sources.py"
      - "tier_b_wave3_shadow.py"
      - "flinamania_product_probe.py"
      - "hot_restock.py"
      - "hot_restock_v4.py"
      - "state_commit_guard.py"
      - "test_alert_policy.py"
      - "test_alert_policy_v2.py"
      - "test_restock_v2_runner.py"
      - "test_restock_lane_ownership.py"
      - "test_faraos_parser_v2.py"
      - "test_tier_b_wave1.py"
      - "test_tier_b_wave1_live.py"
      - "test_tier_b_wave2.py"
      - "test_tier_b_wave3.py"
      - "test_flinamania_product_probe.py"
      - "test_state_commit_guard.py"
      - ".github/workflows/restock.yml"
      - ".github/workflows/hot_restock.yml"
      - ".github/workflows/restock_v2_ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: https://example.invalid/webhook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile changed scanner modules
        run: python -m py_compile alert_policy.py restock_v2_runner.py restock_lane_runner.py faraos_parser_v2.py tier_b_wave1_sources.py tier_b_wave1_shadow.py tier_b_wave2_sources.py tier_b_wave2_shadow.py tier_b_wave3_sources.py tier_b_wave3_shadow.py flinamania_product_probe.py hot_restock.py hot_restock_v4.py state_commit_guard.py

      - name: Test legacy alert policy compatibility
        run: timeout 60s python -m unittest test_alert_policy.py

      - name: Test Restock V2 policy
        run: timeout 60s python -m unittest test_alert_policy_v2.py

      - name: Test Restock V2 channel routing
        run: timeout 60s python -m unittest test_restock_v2_runner.py

      - name: Test Restock lane ownership
        run: timeout 60s python -m unittest test_restock_lane_ownership.py

      - name: Test Faraos parser V2
        run: timeout 60s python -m unittest test_faraos_parser_v2.py

      - name: Test Tier B Wave 1 source health
        run: timeout 60s python -m unittest test_tier_b_wave1.py

      - name: Test Tier B Wave 1 live routing
        run: timeout 60s python -m unittest test_tier_b_wave1_live.py

      - name: Test Tier B Wave 2 shadow
        run: timeout 60s python -m unittest test_tier_b_wave2.py

      - name: Test Tier B Wave 3 shadow
        run: timeout 60s python -m unittest test_tier_b_wave3.py

      - name: Test dormant Flinamania product probe
        run: timeout 60s python -m unittest test_flinamania_product_probe.py

      - name: Test Matraws single guard
        run: timeout 60s python -m unittest test_matraws_single_guard.py

      - name: Test state commit guard
        run: timeout 60s python -m unittest test_state_commit_guard.py
