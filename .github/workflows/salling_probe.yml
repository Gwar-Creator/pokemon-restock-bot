name: Salling Pre-release Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "salling_prerelease_probe.py"
      - ".github/workflows/salling_probe.yml"

permissions:
  contents: write

concurrency:
  group: salling-prerelease-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate probe
        run: python -m py_compile salling_prerelease_probe.py

      - name: Run Salling pre-release probe
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python salling_prerelease_probe.py | tee salling_probe_result.txt

      - name: Save probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salling_probe_result.txt
          if git diff --cached --quiet; then
            echo "Probe result unchanged."
            exit 0
          fi
          git commit -m "Update Salling prerelease probe result"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
