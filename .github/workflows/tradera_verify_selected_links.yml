name: Verify 10 canonical Tradera Cardshow links
on:
  push:
    branches: [cardshow-tradera-2026-11-09]
    paths: ['.github/workflows/tradera_verify_selected_links.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm actual public listing status and full canonical URL
        shell: python
        run: |
          import urllib.request,re,html,json
          from datetime import datetime,timezone
          from html.parser import HTMLParser
          items=json.loads("[[\"marcus92-1\",\"Golem Fossil 36\",\"https://www.tradera.com/da/item/1001337/759306866/golem-36-62-pok%C3%A9mon-fossil\"],[\"marcus92-1\",\"Tentacruel Fossil 44\",\"https://www.tradera.com/da/item/1001337/759307493/tentacruel-44-62-pok%C3%A9mon-fossil\"],[\"marcus92-1\",\"Hypno Fossil 23\",\"https://www.tradera.com/da/item/1001337/759306229/hypno-23-62-pok%C3%A9mon-fossil\"],[\"marcus92-1\",\"Haunter Fossil 21\",\"https://www.tradera.com/da/item/1001337/759306156/haunter-21-62-pok%C3%A9mon-fossil\"],[\"marcus92-1\",\"Gengar Fossil 5\",\"https://www.tradera.com/da/item/1001337/759305869/gengar-5-62-holo-pok%C3%A9mon-fossil\"],[\"AzizKnudsenRamadan\",\"Clefable Jungle 1\",\"https://www.tradera.com/da/item/1001337/760015624/clefable-1-64-holo-jungle-pok%C3%A9mon\"],[\"AzizKnudsenRamadan\",\"Flareon Jungle 3\",\"https://www.tradera.com/da/item/1001337/760011441/flareon-3-64-holo-jungle-pok%C3%A9mon\"],[\"AzizKnudsenRamadan\",\"Articuno Fossil 2\",\"https://www.tradera.com/da/item/1001337/760015071/articuno-2-62-holo-fossil-pok%C3%A9mon\"],[\"kaiserj\",\"Blastoise Base 2\",\"https://www.tradera.com/da/item/1001337/760171752/blastoise-2-102-holo-base-set-pokemon\"],[\"kaiserj\",\"Articuno Fossil 2\",\"https://www.tradera.com/da/item/1001337/760172195/articuno-2-62-holo-fossil-pokemon\"]]")
          for seller,card,url in items:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'da-DK,da;q=0.9'})
              with urllib.request.urlopen(req,timeout=12) as response:
                raw=response.read(900000).decode('utf-8','replace')
                status=response.status
                final_url=response.url
              t=re.search(r'<title[^>]*>(.*?)</title>',raw,re.S)
              title=html.unescape(t.group(1) if t else '')
              signal=re.search(r'isActive.{0,25}hasStarted.{0,25}hasEnded.{0,25}isFinalized.{0,30}forciblyClosed.{0,40}canBeBought',raw)
              # JSON is escaped in Next flight payload; normalized makes embedded status readable
              normalized=raw.replace('\\"','"')
              active=bool(re.search(r'"isActive":true,"hasStarted":true,"hasEnded":false',normalized))
              canbuy='"canBeBought":true' in normalized
              region_match=re.search(r'"allowedBuyerRegion":"([^"]+)"',normalized)
              deadline=re.search(r'<meta property="og:description" content="([^"]+)"',raw)
              desc=html.unescape(deadline.group(1) if deadline else '')
              print('VERIFY',json.dumps({'seller':seller,'card':card,'status':status,'active':active,'canbuy':canbuy,'region':region_match.group(1) if region_match else None,'title':title[:95],'desc':desc[:160],'url':final_url},ensure_ascii=False))
            except Exception as e: print('VERIFY',json.dumps({'seller':seller,'card':card,'error':str(e)[:200],'url':url},ensure_ascii=False))