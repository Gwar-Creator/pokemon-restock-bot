name: Probe Indeks local stock

on:
  push:
    branches:
      - probe-indeks-local-stock
    paths:
      - ".github/workflows/probe_indeks_local_stock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install probe dependencies
        run: pip install requests beautifulsoup4

      - name: Probe public storefront
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          sites = {
              "legekaeden": "https://www.legekaeden.dk/products/bogbind-selvklaebende-50cmx3m-531054",
              "bogide": "https://www.bog-ide.dk/products/batman-the-dark-knight-returns-30th-anniversary-edition-frank-miller-paperback-2494473",
          }
          headers = {"User-Agent": "Mozilla/5.0", "Accept-Language":"da-DK,da;q=0.9,en;q=0.8"}

          for key, url in sites.items():
              print("\n###", key, url)
              r=requests.get(url,headers=headers,timeout=30)
              print("status",r.status_code,"final",r.url,"bytes",len(r.text))
              text=r.text
              low=text.lower()
              for term in ["pickup","click","collect","store","lager","butik","inventory","location"]:
                  print("term",term,"count",low.count(term))
              soup=BeautifulSoup(text,"html.parser")
              variant=None
              for script in soup.find_all("script"):
                  s=script.get_text(" ",strip=True)
                  m=re.search(r'"variantId"\s*:\s*"?([0-9]+)',s,re.I)
                  if not m:
                      m=re.search(r'"variant_id"\s*:\s*"?([0-9]+)',s,re.I)
                  if m:
                      variant=m.group(1); break
              if not variant:
                  inp=soup.select_one('input[name="id"]')
                  if inp:
                      variant=inp.get("value")
              print("variant",variant)
              pickup_nodes=soup.select("pickup-availability, [data-pickup-availability], .pickup-availability")
              print("pickup-elements",len(pickup_nodes))
              for node in pickup_nodes[:3]:
                  print("pickup-node",re.sub(r"\s+"," ",str(node))[:3000])
              interesting_assets=[]
              for tag in soup.find_all(["script","link"]):
                  src=tag.get("src") or tag.get("href")
                  if src and any(t in src.lower() for t in ["pickup","store","location","stock","inventory","theme"]):
                      asset_url=urljoin(r.url,src)
                      print("asset",asset_url)
                      interesting_assets.append(asset_url)
              for asset_url in interesting_assets:
                  if "pickup-availability.js" in asset_url:
                      a=requests.get(asset_url,headers=headers,timeout=30)
                      print("pickup-js",a.status_code,"bytes",len(a.text))
                      print(a.text[:12000])
              patterns=set()
              for pat in [
                  r'https?://[^"\'<> ]+',
                  r'/(?:apps|api|a|local|stores|store|pickup|locations|inventory)[^"\'<> ]*',
              ]:
                  for m in re.findall(pat,text,re.I):
                      if any(t in m.lower() for t in ["pickup","store","location","inventory","lager","butik"]):
                          patterns.add(m[:500])
              for x in sorted(patterns)[:80]:
                  print("candidate",x)

              if variant:
                  probes=[
                      f"/variants/{variant}/?section_id=pickup-availability",
                      f"/variants/{variant}?section_id=pickup-availability",
                      f"/products/{url.rstrip('/').split('/')[-1]}?variant={variant}&section_id=pickup-availability",
                  ]
                  for path in probes:
                      u=urljoin(r.url,path)
                      q=requests.get(u,headers=headers,timeout=30)
                      print("probe",q.status_code,u,"bytes",len(q.text),"sample",re.sub(r"\s+"," ",q.text[:800]))

              data_el=soup.select_one(".pickup-availability__storefront-data")
              if data_el and data_el.get("data-storefront-token") and data_el.get("data-shop-domain"):
                  token=data_el.get("data-storefront-token")
                  domain=data_el.get("data-shop-domain")
                  endpoint=f"https://{domain}/api/2025-07/graphql.json"
                  gql_headers={"Content-Type":"application/json","X-Shopify-Storefront-Access-Token":token}

                  availability_query = """
                  query VariantAvailability($variantId: ID!) {
                    node(id: $variantId) {
                      ... on ProductVariant {
                        id
                        title
                        storeAvailability(first: 250) {
                          nodes {
                            available
                            quantityAvailable
                            pickUpTime
                            location {
                              id
                              name
                              address { address1 city zip country }
                              metafields(identifiers: [
                                { namespace: "store", key: "page_url" },
                                { namespace: "store", key: "store_id" }
                              ]) { key value }
                            }
                          }
                        }
                      }
                    }
                  }
                  """
                  vr=requests.post(endpoint,headers=gql_headers,json={"query":availability_query,"variables":{"variantId":f"gid://shopify/ProductVariant/{variant}"}},timeout=30)
                  print("graphql-variant",vr.status_code)
                  vj=vr.json()
                  nodes=((vj.get("data") or {}).get("node") or {}).get("storeAvailability",{}).get("nodes") or []
                  print("store-count",len(nodes))
                  for node in nodes:
                      loc=node.get("location") or {}
                      addr=loc.get("address") or {}
                      if node.get("quantityAvailable",0)>0 or "vejen" in (loc.get("name") or "").lower() or "vejen" in (addr.get("city") or "").lower():
                          print("store",json.dumps(node,ensure_ascii=False))

                  product_query = """
                  query SearchProducts($query: String!, $after: String) {
                    products(first: 100, after: $after, query: $query, sortKey: UPDATED_AT, reverse: true) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        title
                        handle
                        updatedAt
                        variants(first: 20) {
                          nodes {
                            id
                            title
                            sku
                            barcode
                            availableForSale
                            price { amount currencyCode }
                            storeAvailability(first: 250) {
                              nodes {
                                available
                                quantityAvailable
                                location {
                                  id
                                  name
                                  address { address1 city zip country }
                                  metafields(identifiers: [
                                    { namespace: "store", key: "page_url" },
                                    { namespace: "store", key: "store_id" }
                                  ]) { key value }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  """
                  recent_query = """
                  query RecentProducts($after: String) {
                    products(first: 250, after: $after, sortKey: UPDATED_AT, reverse: true) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        title
                        handle
                        updatedAt
                        variants(first: 20) { nodes { id title sku barcode availableForSale } }
                      }
                    }
                  }
                  """
                  recent_candidates=[]
                  after=None
                  markers=("pokemon","pokémon","tcg","booster","elite trainer","trainer box","binder","poster"," tin","tin ","collection"," ex ","ex box","30th","30 ","celebr","anniversary","jubil")
                  for page_no in range(1,7):
                      rr=requests.post(endpoint,headers=gql_headers,json={"query":recent_query,"variables":{"after":after}},timeout=30)
                      rj=rr.json()
                      pdata=((rj.get("data") or {}).get("products") or {})
                      if rj.get("errors"):
                          print("recent-errors",json.dumps(rj["errors"],ensure_ascii=False))
                          break
                      for product in pdata.get("nodes") or []:
                          low=(product.get("title") or "").lower()
                          if any(m in low for m in markers):
                              recent_candidates.append(product)
                      pi=pdata.get("pageInfo") or {}
                      if not pi.get("hasNextPage"):
                          break
                      after=pi.get("endCursor")
                  print("RECENT-CANDIDATES",len(recent_candidates))
                  for product in recent_candidates:
                      vejen=[]
                      for var in ((product.get("variants") or {}).get("nodes") or []):
                          ar=requests.post(endpoint,headers=gql_headers,json={"query":availability_query,"variables":{"variantId":var.get("id")}},timeout=30)
                          aj=ar.json()
                          stocks=((aj.get("data") or {}).get("node") or {}).get("storeAvailability",{}).get("nodes") or []
                          for stock in stocks:
                              loc=stock.get("location") or {}
                              addr=loc.get("address") or {}
                              if "vejen" in (loc.get("name") or "").lower() or "vejen" in (addr.get("city") or "").lower():
                                  vejen.append({"variant":var,"stock":stock})
                      low=(product.get("title") or "").lower()
                      if vejen or any(m in low for m in ("tcg","booster","elite trainer","trainer box","binder","poster"," tin","tin ","collection","30th","celebr","anniversary","jubil")):
                          print("recent-product",json.dumps({"title":product.get("title"),"handle":product.get("handle"),"updatedAt":product.get("updatedAt"),"vejen":vejen},ensure_ascii=False))

                  price_scan_query = """
                  query RecentPriceScan($after: String) {
                    products(first: 250, after: $after, sortKey: UPDATED_AT, reverse: true) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        title
                        handle
                        productType
                        tags
                        updatedAt
                        variants(first: 20) {
                          nodes {
                            id
                            title
                            sku
                            barcode
                            price { amount currencyCode }
                            storeAvailability(first: 250) {
                              nodes {
                                available
                                quantityAvailable
                                location {
                                  id
                                  name
                                  address { city zip }
                                  metafields(identifiers: [{ namespace: "store", key: "store_id" }]) { key value }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  """
                  target_prices={899.95,499.95,319.95,399.95,379.95}
                  after=None
                  print("PRICE-SCAN-START")
                  for page_no in range(1,9):
                      pr=requests.post(endpoint,headers=gql_headers,json={"query":price_scan_query,"variables":{"after":after}},timeout=30)
                      pj=pr.json()
                      pdata=((pj.get("data") or {}).get("products") or {})
                      if pj.get("errors"):
                          print("price-scan-errors",json.dumps(pj["errors"],ensure_ascii=False))
                          break
                      for product in pdata.get("nodes") or []:
                          matches=[]
                          for var in ((product.get("variants") or {}).get("nodes") or []):
                              try:
                                  price=float(((var.get("price") or {}).get("amount")))
                              except (TypeError,ValueError):
                                  continue
                              if not any(abs(price-p)<0.001 for p in target_prices):
                                  continue
                              vejen=[]
                              for stock in ((var.get("storeAvailability") or {}).get("nodes") or []):
                                  loc=stock.get("location") or {}
                                  store_ids=[m.get("value") for m in (loc.get("metafields") or []) if isinstance(m,dict) and m.get("key")=="store_id"]
                                  addr=loc.get("address") or {}
                                  if "13280" in store_ids or "vejen" in (loc.get("name") or "").lower() or (addr.get("city") or "").lower()=="vejen":
                                      vejen.append({"quantity":stock.get("quantityAvailable"),"available":stock.get("available"),"location":loc})
                              matches.append({"price":price,"variant":var.get("title"),"sku":var.get("sku"),"barcode":var.get("barcode"),"vejen":vejen})
                          if matches:
                              print("price-match",json.dumps({"title":product.get("title"),"handle":product.get("handle"),"productType":product.get("productType"),"tags":product.get("tags"),"updatedAt":product.get("updatedAt"),"matches":matches},ensure_ascii=False))
                      pi=pdata.get("pageInfo") or {}
                      if not pi.get("hasNextPage"):
                          break
                      after=pi.get("endCursor")
                  print("PRICE-SCAN-DONE")

                  for search_query in ["30th", "Celebration", "Pokemon", "Pokémon"]:
                      print("SEARCH",search_query)
                      after=None
                      seen=0
                      for page_no in range(1,6):
                          sr=requests.post(endpoint,headers=gql_headers,json={"query":product_query,"variables":{"query":search_query,"after":after}},timeout=30)
                          print("graphql-search",search_query,page_no,sr.status_code)
                          sj=sr.json()
                          pdata=((sj.get("data") or {}).get("products") or {})
                          if sj.get("errors"):
                              print("graphql-errors",json.dumps(sj["errors"],ensure_ascii=False))
                              break
                          for product in pdata.get("nodes") or []:
                              title=(product.get("title") or "")
                              low_title=title.lower()
                              vejen=[]
                              for var in ((product.get("variants") or {}).get("nodes") or []):
                                  for stock in ((var.get("storeAvailability") or {}).get("nodes") or []):
                                      loc=stock.get("location") or {}
                                      addr=loc.get("address") or {}
                                      if "vejen" in (loc.get("name") or "").lower() or "vejen" in (addr.get("city") or "").lower():
                                          vejen.append({
                                              "variant": var.get("title"),
                                              "variant_id": var.get("id"),
                                              "sku": var.get("sku"),
                                              "barcode": var.get("barcode"),
                                              "availableForSale": var.get("availableForSale"),
                                              "quantity": stock.get("quantityAvailable"),
                                              "available": stock.get("available"),
                                              "location": loc,
                                          })
                              if any(x in low_title for x in ["30", "pokemon", "pokémon", "celebr"]):
                                  print("product",json.dumps({"title":title,"handle":product.get("handle"),"updatedAt":product.get("updatedAt"),"vejen":vejen},ensure_ascii=False))
                              seen += 1
                          pi=pdata.get("pageInfo") or {}
                          if not pi.get("hasNextPage"):
                              break
                          after=pi.get("endCursor")
                      print("SEARCH-DONE",search_query,"seen",seen)
          PY
