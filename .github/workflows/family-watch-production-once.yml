name: Family Watch Production Baseline

on:
  push:
    paths:
      - ".github/workflows/family-watch-production-once.yml"

permissions:
  contents: write

concurrency:
  group: family-watch
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Family Watch
        run: |
          python -m py_compile family_watch.py
          python -m unittest test_family_watch.py
      - name: Run production baseline
        env:
          FAMILY_WATCH_WEBHOOK_URL: ${{ secrets.FAMILY_WATCH_WEBHOOK_URL }}
          FAMILY_WATCH_DRY_RUN: "0"
        run: |
          test -n "$FAMILY_WATCH_WEBHOOK_URL"
          python family_watch.py
      - name: Save Family Watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- family_watch_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update Family Watch flyer state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
