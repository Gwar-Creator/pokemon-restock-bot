name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Inspect Coop frontend catalog requests
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          base='https://superbrugsen.coop.dk/avis/'
          r=requests.get(base,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          soup=BeautifulSoup(r.text,'html.parser')
          wanted=[]
          for s in soup.find_all('script'):
            src=s.get('src')
            if src and any(name in src for name in ['shopgun.js','catalogDataController.js','catalog.js','incito.js','catalogSearchController.js','offerController.js']):
              wanted.append(urljoin(base,src))
          for url in wanted:
            rr=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
            print('\n###',url,rr.status_code,'len',len(rr.text))
            text=rr.text
            for needle in ['api_key','apiKey','X-Api-Key','squid-api','generate_incito','publication','catalogData','offerSearch','shopgun']:
              hits=list(re.finditer(re.escape(needle),text,re.I))[:5]
              print('NEEDLE',needle,'hits',len(hits))
              for m in hits:
                print(repr(text[max(0,m.start()-700):m.start()+1800]))
          PY
