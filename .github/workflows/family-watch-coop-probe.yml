name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Inspect Coop Incito offer nodes
        run: |
          python - <<'PY'
          import re, requests, concurrent.futures
          from bs4 import BeautifulSoup
          import family_watch as fw

          sites={
            'Kvickly':'https://kvickly.coop.dk/avis/',
            'SuperBrugsen':'https://superbrugsen.coop.dk/avis/',
            'DagliBrugsen':'https://brugsen.coop.dk/avis/',
            '365discount':'https://365discount.coop.dk/365avis/',
          }
          for store,base in sites.items():
              page=requests.get(base,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
              soup=BeautifulSoup(page.text,'html.parser')
              key=re.search(r"_shopgunApiKey=['\"]([^'\"]+)",page.text,re.I).group(1)
              pub=soup.select_one('.incito-wrapper[data-publication-id], .shopgun-wrapper[data-publication-id]').get('data-publication-id')
              headers={'User-Agent':'Mozilla/5.0','X-Api-Key':key,'X-Widgets-Version':'v1','Content-Type':'application/json'}
              detail=requests.get(f'https://squid-api.tjek.com/v2/catalogs/{pub}',headers=headers,timeout=30).json()
              body={'id':pub,'device_category':'desktop','orientation':'vertical','pointer':'fine','pixel_ratio':1,'max_width':1000,'versions_supported':['1.0.0']}
              root=requests.post(fw.TJEK_INCITO_URL,headers=headers,json=body,timeout=30).json()
              bodies=fw._find_section_bodies(root.get('root_view'))
              unique=[]; seen=set()
              for b in bodies:
                  sid=str(b.get('section_id') or '')
                  if sid and sid not in seen:
                      seen.add(sid); unique.append(b)
              print('\n###',store,'pub',pub,'period',detail.get('run_from'),detail.get('run_till'),'sections',len(unique))

              def fetch(b):
                  try:
                      r=requests.post(fw.TJEK_SECTION_URL,headers=headers,json=b,timeout=30)
                      r.raise_for_status(); return r.json()
                  except Exception as e:
                      return {'_err':repr(e)}
              nodes=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  for section in pool.map(fetch,unique):
                      nodes.extend(fw._find_offer_nodes(section))
              print('OFFER_NODES',len(nodes))
              samples=[]
              for n in nodes:
                  label=str(n.get('accessibility_label') or '')
                  texts=' | '.join(fw._descendant_texts(n))
                  searchable=(label+' '+texts).lower()
                  if any(term in searchable for term in ['cheasy','arla protein','stay strong','skyr','uld','ble']):
                      samples.append((n.get('id'),label,texts[:600],list(n.keys())))
              print('MATCH_SAMPLES',samples[:30])
              if not samples:
                  print('FIRST_SAMPLES',[(n.get('id'),n.get('accessibility_label'),' | '.join(fw._descendant_texts(n))[:500],list(n.keys())) for n in nodes[:12]])
          PY
