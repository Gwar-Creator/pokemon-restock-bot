name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Probe Coop publication feed
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          urls={
            'Kvickly':'https://kvickly.coop.dk/avis/',
            'SuperBrugsen':'https://superbrugsen.coop.dk/avis/',
            'DagliBrugsen':'https://brugsen.coop.dk/avis/',
            '365discount':'https://365discount.coop.dk/365avis/',
          }
          endpoint='https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication'
          for store,url in urls.items():
            r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
            covers=re.findall(r'business_incito_publications%2F([^%&]+)%2F([^%&]+)%2Fcover',r.text,re.I)
            print('\n###',store,'covers',covers[:5])
            for business,pub in covers[:3]:
              body={
                'id':pub,
                'device_category':'desktop',
                'orientation':'vertical',
                'pointer':'fine',
                'pixel_ratio':1,
                'max_width':1000,
                'versions_supported':['1.0.0'],
              }
              rr=requests.post(endpoint,json=body,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'},timeout=30)
              print('POST',business,pub,rr.status_code,rr.text[:500])
            soup=BeautifulSoup(r.text,'html.parser')
            scripts=[s.get('src') for s in soup.find_all('script') if s.get('src')]
            print('SCRIPTS',scripts[-15:])
          PY
