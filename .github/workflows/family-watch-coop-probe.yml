name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Inspect exact Coop offer API calls
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          base='https://superbrugsen.coop.dk/avis/'
          r=requests.get(base,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          soup=BeautifulSoup(r.text,'html.parser')

          print('PAGE GLOBALS')
          for needle in ['_shopgunApiKey','_shopGunTrackId','shopgun-wrapper','incito-wrapper','publication-id','publicationId']:
              for m in list(re.finditer(re.escape(needle),r.text,re.I))[:8]:
                  print('\n',needle,repr(r.text[max(0,m.start()-900):m.start()+2200]))

          for name in ['catalogSearchController.js','offerController.js']:
              src=next((s.get('src') for s in soup.find_all('script') if s.get('src') and name in s.get('src')),None)
              if not src:
                  print('MISSING',name)
                  continue
              url=urljoin(base,src)
              rr=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
              print('\n### FULL',name,url,rr.status_code)
              print(rr.text)
          PY
