name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Verify direct Coop offer feeds
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          sites={
            'Kvickly':'https://kvickly.coop.dk/avis/',
            'SuperBrugsen':'https://superbrugsen.coop.dk/avis/',
            'DagliBrugsen':'https://brugsen.coop.dk/avis/',
            '365discount':'https://365discount.coop.dk/365avis/',
          }
          headers={'User-Agent':'Mozilla/5.0'}
          for store,base in sites.items():
              print('\n###',store,base)
              r=requests.get(base,headers=headers,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              keym=re.search(r"_shopgunApiKey=['\"]([^'\"]+)",r.text,re.I)
              key=keym.group(1) if keym else ''
              wrappers=soup.select('.incito-wrapper[data-publication-id], .shopgun-wrapper[data-publication-id]')
              print('KEY?',bool(key),'WRAPPERS',[(w.get('class'),w.get('data-publication-id')) for w in wrappers])

              for route in [
                  '/umbraco/api/CatalogSearch/Search',
                  '/umbraco/api/catalogsearch/search',
              ]:
                  rr=requests.get(base.rstrip('/')+route,params={'searchTerm':'Cheasy'},headers=headers,timeout=30)
                  print('SEARCH',route,rr.status_code,rr.text[:1200])

              endpoint='https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication'
              for w in wrappers[:2]:
                  pub=w.get('data-publication-id')
                  body={
                    'id':pub,
                    'device_category':'desktop',
                    'orientation':'vertical',
                    'pointer':'fine',
                    'pixel_ratio':1,
                    'max_width':1000,
                    'versions_supported':['1.0.0'],
                  }
                  rr=requests.post(endpoint,json=body,headers={**headers,'Content-Type':'application/json','X-Api-Key':key},timeout=30)
                  print('TJEK',pub,rr.status_code,'len',len(rr.text),rr.text[:1000])

              for suffix in ['naesteuge/','næsteuge/','?tilbudType=next']:
                  u=base+suffix
                  rr=requests.get(u,headers=headers,timeout=30)
                  ss=BeautifulSoup(rr.text,'html.parser')
                  ww=ss.select('.incito-wrapper[data-publication-id], .shopgun-wrapper[data-publication-id]')
                  period=' '.join(x.get_text(' ',strip=True) for x in ss.select('.date-periode'))
                  print('NEXT?',u,rr.status_code,rr.url,'wrappers',[x.get('data-publication-id') for x in ww],'period',period[:250])
          PY
