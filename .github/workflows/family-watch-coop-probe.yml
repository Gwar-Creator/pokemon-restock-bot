name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Inspect Coop flyer widget metadata
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          urls={
            'Kvickly':'https://kvickly.coop.dk/avis/',
            'SuperBrugsen':'https://superbrugsen.coop.dk/avis/',
            'DagliBrugsen':'https://brugsen.coop.dk/avis/',
            '365discount':'https://365discount.coop.dk/365avis/',
          }
          for store,url in urls.items():
            r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
            soup=BeautifulSoup(r.text,'html.parser')
            print('\n###',store)
            for sel in ['.tjek-widget','[data-api-key]','[data-business-id]','[data-id]']:
              nodes=soup.select(sel)
              print('SEL',sel,'count',len(nodes))
              for n in nodes[:8]:
                print(str(n)[:2500])
            for needle in ['squid-api.tjek.com','tjek.com','data-api-key','publication-viewer','catalog']:
              print('NEEDLE',needle)
              for m in list(re.finditer(re.escape(needle),r.text,re.I))[:3]:
                print(repr(r.text[max(0,m.start()-1000):m.start()+2500]))
          PY
