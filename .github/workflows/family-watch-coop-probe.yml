name: Family Watch Coop Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-coop-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Discover Coop catalog lists
        run: |
          python - <<'PY'
          import re, requests, json
          from bs4 import BeautifulSoup

          sites={
            'Kvickly':'https://kvickly.coop.dk/avis/',
            'SuperBrugsen':'https://superbrugsen.coop.dk/avis/',
            'DagliBrugsen':'https://brugsen.coop.dk/avis/',
            '365discount':'https://365discount.coop.dk/365avis/',
          }
          headers0={'User-Agent':'Mozilla/5.0'}
          for store,base in sites.items():
              r=requests.get(base,headers=headers0,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              key=re.search(r"_shopgunApiKey=['\"]([^'\"]+)",r.text,re.I).group(1)
              wrapper=soup.select_one('.incito-wrapper[data-publication-id], .shopgun-wrapper[data-publication-id]')
              pub=wrapper.get('data-publication-id') if wrapper else ''
              headers={**headers0,'X-Api-Key':key,'X-Widgets-Version':'v1'}
              print('\n###',store,'pub',pub)
              for url in [
                  f'https://squid-api.tjek.com/v2/catalogs/{pub}',
                  f'https://squid-api.tjek.com/v2/publications/{pub}',
              ]:
                  rr=requests.get(url,headers=headers,timeout=30)
                  print('DETAIL',url,rr.status_code,rr.text[:2500])

              root=requests.post(
                  'https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication',
                  headers={**headers,'Content-Type':'application/json'},
                  json={'id':pub,'device_category':'desktop','orientation':'vertical','pointer':'fine','pixel_ratio':1,'max_width':1000,'versions_supported':['1.0.0']},timeout=30
              ).json()
              hits=[]
              def walk(v,path=''):
                  if isinstance(v,dict):
                      for k,x in v.items():
                          p=f'{path}.{k}' if path else k
                          if any(t in k.lower() for t in ['dealer','business','run_from','run_till','publish']):
                              hits.append((p,x if not isinstance(x,(dict,list)) else type(x).__name__))
                          walk(x,p)
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,f'{path}[{i}]')
              walk(root)
              print('ROOT_META',hits[:100])

              candidates=[]
              for pat in [r'business_incito_publications%2F([^%&]+)%2F',r'uploads/businesses/([^/]+)/']:
                  candidates += re.findall(pat,r.text,re.I)
              candidates=list(dict.fromkeys(candidates))
              print('DEALER_CANDIDATES',candidates[:20])
              for dealer in candidates[:10]:
                  rr=requests.get('https://squid-api.tjek.com/v2/catalogs',params={'dealer_id':dealer,'types':'paged,incito'},headers=headers,timeout=30)
                  if rr.status_code==200:
                      try: data=rr.json()
                      except: data=[]
                      if isinstance(data,list) and data:
                          print('CATALOGS',dealer,len(data),[(x.get('id'),x.get('label'),x.get('run_from'),x.get('run_till'),x.get('publish'),x.get('types')) for x in data[:10]])
          PY
