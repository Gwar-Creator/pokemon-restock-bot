name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests
      - name: Probe Tjek widget network endpoints
        run: |
          python - <<'PY'
          import re, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          urls=['https://widgets.tjek.com/v1.js','https://js-sdk.tjek.com/sgn-sdk-4.x.x.min.js']
          for url in urls:
              r=s.get(url,timeout=30)
              print('\n===',url,'STATUS',r.status_code,'LEN',len(r.text),'===')
              r.raise_for_status(); text=r.text
              domains=sorted(set(re.findall(r'https?://[^"\'` )]+', text)))
              print('URLS')
              for x in domains[:200]:
                  if any(k in x.lower() for k in ['tjek','shopgun','api','publication']): print(x[:500])
              for needle in ['api.shopgun','api.tjek','paged_publication','paged-publication','publication_v2','publications','hotspots','apiKey','api-key','Authorization','Bearer']:
                  i=text.find(needle)
                  if i>=0:
                      print('\nNEEDLE',needle,'INDEX',i)
                      print(text[max(0,i-800):i+1800].replace('\n',' ')[:2800])
          PY
