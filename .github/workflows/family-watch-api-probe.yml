name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests beautifulsoup4
      - name: Probe Løvbjerg Vejen flyer source
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          url='https://www.lovbjerg.dk/avis/denne-uges-avis/vejen'
          r=s.get(url,timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text),'TYPE',r.headers.get('content-type'))
          r.raise_for_status()
          text=r.text
          for needle in ['Avisen gælder','Download PDF','pdf','iframe','QDW7NY6N','publication','catalog','catalogue','viewer']:
              i=text.lower().find(needle.lower())
              print('\nNEEDLE',needle,'INDEX',i)
              if i>=0:
                  print(text[max(0,i-700):i+1800].replace('\n',' ')[:2600])
          soup=BeautifulSoup(text,'html.parser')
          print('\nLINKS')
          for tag in soup.find_all(['a','iframe'], href=True)+soup.find_all('iframe',src=True):
              target=tag.get('href') or tag.get('src')
              if target and any(k in target.lower() for k in ['pdf','avis','catalog','viewer','superego']):
                  print(tag.name,target)
          print('\nSCRIPTS')
          for tag in soup.find_all('script'):
              body=tag.string or tag.get_text() or ''
              if any(k in body.lower() for k in ['qdw7ny6n','pdf','catalog','publication','avis']):
                  print(body[:5000].replace('\n',' '))
          print('\nPDF_URLS')
          for m in sorted(set(re.findall(r'https?://[^"\'<> ]+\.pdf[^"\'<> ]*', text, re.I))):
              print(m)
          PY
