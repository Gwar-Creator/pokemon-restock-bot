name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests
      - name: Inspect Tjek widget fetch paths
        run: |
          python - <<'PY'
          import requests
          text=requests.get('https://widgets.tjek.com/v1.js',timeout=30).text
          for needle in ['function fetchPublications','const fetchPublications','fetchPublications =','fetchPublication','squid-api.tjek.com','/publications','/publication','/offers','/hotspots','X-Api-Key']:
              start=0
              while True:
                  i=text.find(needle,start)
                  if i<0: break
                  print('\n===',needle,'AT',i,'===')
                  print(text[max(0,i-1400):i+3500].replace('\n',' '))
                  start=i+1
          PY
