name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests beautifulsoup4
      - name: Probe Løvbjerg Incito offer structure
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup

          page=requests.get('https://www.lovbjerg.dk/avis/denne-uges-avis/vejen',headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          widget=soup.select_one('.tjek-widget[data-type="publication-viewer"]')
          key=widget.get('data-api-key'); pub=widget.get('data-id')
          headers={'User-Agent':'Mozilla/5.0','X-Api-Key':key,'X-Widgets-Version':'v1','Content-Type':'application/json'}
          body={'id':pub,'device_category':'desktop','orientation':'vertical','pointer':'fine','pixel_ratio':1,'max_width':1000,'versions_supported':['1.0.0']}
          r=requests.post('https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication',headers=headers,json=body,timeout=30)
          print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.text))
          r.raise_for_status()
          data=r.json()
          print('TOP_KEYS',list(data)[:50] if isinstance(data,dict) else type(data).__name__)
          raw=json.dumps(data,ensure_ascii=False)
          for needle in ['Semper','klemmepose','KLEMMEPOSE','grød','Yummies','offer_id','offerId','offer']:
              i=raw.lower().find(needle.lower())
              print('\nNEEDLE',needle,'INDEX',i)
              if i>=0:
                  print(raw[max(0,i-1500):i+4000])
          print('\nHEAD',raw[:10000])
          PY
