name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests beautifulsoup4
      - name: Search Løvbjerg Incito sections for Family Watch products
        run: |
          python - <<'PY'
          import concurrent.futures, json, requests
          from bs4 import BeautifulSoup

          page=requests.get('https://www.lovbjerg.dk/avis/denne-uges-avis/vejen',headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          widget=soup.select_one('.tjek-widget[data-type="publication-viewer"]')
          key=widget.get('data-api-key'); pub=widget.get('data-id')
          headers={'User-Agent':'Mozilla/5.0','X-Api-Key':key,'X-Widgets-Version':'v1','Content-Type':'application/json'}
          root_body={'id':pub,'device_category':'desktop','orientation':'vertical','pointer':'fine','pixel_ratio':1,'max_width':1000,'versions_supported':['1.0.0']}
          root=requests.post('https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication',headers=headers,json=root_body,timeout=30).json()

          sections=[]
          def walk(node):
              if isinstance(node,dict):
                  if node.get('view_name')=='IncitoEmbedView' and node.get('src','').endswith('generate_incito_from_publication_section') and node.get('body'):
                      try:
                          sections.append(json.loads(node['body']))
                      except Exception:
                          pass
                  for value in node.values(): walk(value)
              elif isinstance(node,list):
                  for value in node: walk(value)
          walk(root.get('root_view'))
          unique=[]; seen=set()
          for body in sections:
              sid=body.get('section_id')
              if sid and sid not in seen:
                  seen.add(sid); unique.append(body)
          print('SECTIONS',len(unique))

          def fetch_section(body):
              r=requests.post('https://squid-api.tjek.com/v4/rpc/generate_incito_from_publication_section',headers=headers,json=body,timeout=30)
              return body.get('page_number'), body.get('section_id'), r.status_code, r.text

          terms=['semper','klemmepose','klemme pose','grød','grod','smoothie','sensilac','vådserviet','vadserviet']
          hits=[]; errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              for page_no,sid,status,text in pool.map(fetch_section,unique):
                  if status != 200:
                      errors.append((page_no,sid,status)); continue
                  low=text.lower()
                  matched=[term for term in terms if term in low]
                  if matched:
                      hits.append((page_no,sid,matched,text))
          print('ERRORS',errors)
          print('HITS',[(p,s,m) for p,s,m,_ in hits])
          for page_no,sid,matched,text in hits:
              print('\nMATCH_PAGE',page_no,'SECTION',sid,'TERMS',matched,'LEN',len(text))
              low=text.lower()
              positions=[low.find(term) for term in matched if low.find(term)>=0]
              i=min(positions) if positions else 0
              print(text[max(0,i-4000):i+8000])
          PY
