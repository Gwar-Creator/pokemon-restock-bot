name: Family Watch API Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests beautifulsoup4
      - name: Probe eTilbudsavis search HTML
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          for q in ['semper','semper grød','semper smoothie','vådservietter','sensilac']:
              url='https://etilbudsavis.dk/soeg/'+requests.utils.quote(q, safe='')
              r=s.get(url,timeout=30)
              print('\n===',q,'STATUS',r.status_code,'LEN',len(r.text),'TYPE',r.headers.get('content-type'),'===')
              r.raise_for_status()
              text=r.text
              for needle in ['"validFrom"','"visibleFrom"','"businessPublicId"','"publicationPublicId"','"data"']:
                  i=text.find(needle)
                  print('NEEDLE',needle,'INDEX',i)
                  if i>=0:
                      print(text[max(0,i-250):i+750].replace('\n',' ')[:1100])
              soup=BeautifulSoup(text,'html.parser')
              json_scripts=[]
              for idx,tag in enumerate(soup.find_all('script')):
                  body=tag.string or tag.get_text() or ''
                  typ=tag.get('type','')
                  ident=tag.get('id','')
                  if 'validFrom' in body or 'publicationPublicId' in body or typ=='application/json' or ident=='__NEXT_DATA__':
                      json_scripts.append((idx,typ,ident,len(body),body[:1000]))
              print('INTERESTING_SCRIPTS',len(json_scripts))
              for item in json_scripts[:10]:
                  print('SCRIPT',item[0],item[1],item[2],item[3],item[4].replace('\n',' ')[:1000])
          PY
