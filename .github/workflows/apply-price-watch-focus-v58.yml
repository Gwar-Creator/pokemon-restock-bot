name: Apply Price Watch Focus V58

on:
  push:
    paths:
      - "apply_price_watch_focus_v58.py"
      - ".github/workflows/apply-price-watch-focus-v58.yml"

permissions:
  contents: write

concurrency:
  group: apply-price-watch-focus-v58
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply migration
        run: python apply_price_watch_focus_v58.py

      - name: Validate production scanner
        run: |
          python -m py_compile restock_bot_github.py
          python -m unittest -q test_discord_cleanup.py test_alert_policy.py test_matraws_single_guard.py test_state_commit_guard.py

      - name: Commit production change and clean migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restock_bot_github.py
          git rm -f apply_price_watch_focus_v58.py .github/workflows/apply-price-watch-focus-v58.yml
          git commit -m "Refocus Price Watch on selected sealed sets"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
