name: Family Watch Enrichment Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-enrichment-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify live app and membership metadata
        run: |
          python - <<'PY'
          import requests
          import family_watch as fw
          import family_watch_runner as runner

          html = requests.get(
              'https://etilbudsavis.dk/soeg/slik',
              headers={'User-Agent': fw.USER_AGENT},
              timeout=30,
          ).text
          products = runner.extract_embedded_product_dicts(html)
          special = [p for p in products if p.get('appPrice') is not None or p.get('membershipPrice') is not None]
          enriched = runner.extract_etilbudsavis_offer_dicts(html)
          access = [o for o in enriched if runner.ACCESS_MARKER in str(o.get('description') or '')]

          print('products', len(products), 'special_prices', len(special), 'access_enriched', len(access))
          assert products, 'No embedded eTilbudsavis products parsed'
          assert special, 'No live app/membership prices parsed'
          assert access, 'No JSON-LD offers enriched with app/membership requirements'

          for p in special[:8]:
              business = p.get('business') or {}
              store = business.get('name', '') if isinstance(business, dict) else ''
              print('SPECIAL', store, '|', p.get('name'), '| regular', p.get('price'), '| app', p.get('appPrice'), '| member', p.get('membershipPrice'))
          for o in access[:8]:
              print('ENRICHED', (o.get('seller') or {}).get('name', ''), '|', o.get('name'), '| effective', o.get('price'), '|', o.get('description'))
          PY
