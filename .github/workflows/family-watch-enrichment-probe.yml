name: Family Watch Enrichment Probe

on:
  push:
    paths:
      - ".github/workflows/family-watch-enrichment-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose live product data
        run: |
          python - <<'PY'
          import re
          import requests
          from curl_cffi import requests as crequests
          import family_watch as fw
          import family_watch_runner as runner

          url='https://etilbudsavis.dk/soeg/slik'
          variants=[]
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          variants.append(('requests',r.status_code,r.url,r.text))
          c=crequests.get(url,impersonate='chrome',timeout=30)
          variants.append(('chrome',c.status_code,c.url,c.text))

          for label,status,final_url,html in variants:
              print('\nVARIANT',label,'status',status,'len',len(html),'url',final_url)
              print('markers', {m: html.find(m) for m in ['publicId','appPrice','membershipPrice','self.__next_f.push','__NEXT_DATA__','KujH1JEc']})
              print('scripts', len(re.findall(r'<script', html, flags=re.I)))
              products=runner.extract_embedded_product_dicts(html)
              print('parsed_products',len(products),'special',sum(1 for p in products if p.get('appPrice') is not None or p.get('membershipPrice') is not None))
              for marker in ['publicId','appPrice','self.__next_f.push']:
                  i=html.find(marker)
                  if i>=0:
                      print('SNIP',marker,repr(html[max(0,i-500):i+1500]))
          PY
