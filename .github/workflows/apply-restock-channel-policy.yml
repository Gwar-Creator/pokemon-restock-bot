name: Apply Restock Discord source policy

on:
  push:
    paths:
      - ".github/workflows/apply-restock-channel-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Restock Discord routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("restock_bot_github.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def send_discord(message):\n"
          end_marker = "\ndef send_price_watch(message):\n"

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("send_discord start marker not found")

          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("send_discord end marker not found")

          replacement = '''RESTOCK_DISCORD_ALLOWED_SOURCES = (
              "COOLSHOP",
              "PROSHOP",
              "BR",
              "BILKA",
              "FØTEX",
          )


          def restock_channel_alert_allowed(message):
              """Mute ordinary restocks outside the selected retail sources."""
              lines = [
                  line.replace("**", "").strip()
                  for line in str(message or "").splitlines()
                  if line.strip()
              ]
              headline = lines[0].upper() if lines else ""

              # Actual product-restock headlines use [GAME] ... RESTOCK.
              # New products, preorders and operational messages stay unchanged.
              if not re.search(r"\\[[^\\]]+\\].*\\bRESTOCK\\b", headline):
                  return True

              return any(
                  re.search(rf"\\b{re.escape(source)}\\b", headline)
                  for source in RESTOCK_DISCORD_ALLOWED_SOURCES
              )


          def send_discord(message):
              if not restock_channel_alert_allowed(message):
                  headline = next(
                      (
                          line.replace("**", "").strip()
                          for line in str(message or "").splitlines()
                          if line.strip()
                      ),
                      "ukendt restock",
                  )
                  print(
                      "RESTOCK CHANNEL: almindelig restock muted: "
                      f"{headline}"
                  )
                  return False

              alert_decision = restock_alert_decision(message)

              if not alert_decision:
                  print("RESTOCK ALERT: dublet/flap undertrykt")
                  return False

              _post_discord(
                  WEBHOOK_URL,
                  message,
                  "restock",
              )
              alert_key, alert_entry = alert_decision
              if alert_key:
                  RESTOCK_ALERT_MEMORY[alert_key] = alert_entry
              product_fingerprint = (alert_entry or {}).get("product_fp")
              if product_fingerprint:
                  RESTOCK_SEEN_PRODUCTS.add(product_fingerprint)
              return True

          '''

          updated = text[:start] + replacement + text[end + 1:]
          path.write_text(updated, encoding="utf-8")
          PY

          python -m py_compile restock_bot_github.py

      - name: Verify Restock source policy
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          tree = ast.parse(Path("restock_bot_github.py").read_text(encoding="utf-8"))
          selected = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = [target.id for target in node.targets if isinstance(target, ast.Name)]
                  if "RESTOCK_DISCORD_ALLOWED_SOURCES" in names:
                      selected.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name == "restock_channel_alert_allowed":
                  selected.append(node)

          ns = {"re": re}
          exec(compile(ast.Module(body=selected, type_ignores=[]), "policy-test", "exec"), ns)
          allowed = ns["restock_channel_alert_allowed"]

          cases = (
              ("🔥 **[POKÉMON] COOLSHOP RESTOCK**\n**Test**", True),
              ("🔥 **[POKÉMON] PROSHOP RESTOCK**\n**Test**", True),
              ("🏪 **[POKÉMON] BR KOLDING RESTOCK**\n**Test**", True),
              ("🏪 **[POKÉMON] BILKA KOLDING RESTOCK**\n**Test**", True),
              ("🏪 **[POKÉMON] FØTEX KOLDING SYD RESTOCK**\n**Test**", True),
              ("🔥 **[POKÉMON] ROGERZ RESTOCK**\n**Umbreon ex**", False),
              ("🔥 **[POKÉMON] EPIC PANDA RESTOCK**\n**Test**", False),
              ("🆕 **[POKÉMON] NYT HOS ROGERZ**\n**Test**", True),
              ("🆕 **[POKÉMON] NY FORUDBESTILLING HOS ROGERZ**\n**Test**", True),
              ("🟢 **Restock Bot aktiv**", True),
          )

          for message, expected in cases:
              actual = allowed(message)
              if actual is not expected:
                  raise SystemExit(
                      f"Policy test failed: {message.splitlines()[0]} -> {actual}, expected {expected}"
                  )

          print(f"Policy tests passed: {len(cases)} cases")
          PY

      - name: Commit policy change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- restock_bot_github.py

          if git diff --cached --quiet; then
            echo "No code change to commit."
            exit 0
          fi

          git commit -m "Limit Restock Discord to retail sources"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Policy change pushed successfully."
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push policy change after 3 attempts."
          exit 1
