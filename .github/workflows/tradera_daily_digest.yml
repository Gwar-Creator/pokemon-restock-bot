name: Tradera Vintage Daily Auction Digest

on:
  # Once daily; 07:50 CET / 08:50 CEST. GitHub cron is best effort.
  # Manual health trigger verified 2026-11-16.
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradera_daily_digest.yml"
      - "tradera_daily_digest.py"

permissions:
  contents: read

concurrency:
  group: tradera-daily-auction-digest
  cancel-in-progress: false

jobs:
  daily-auction-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install read-only Tradera client
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Offline syntax and regression checks
        run: |
          python -m py_compile tradera_daily_digest.py vintage_finder_tradera.py vintage_marketplace_live.py
          python -m unittest -q test_vintage_finder_tradera.py test_vintage_marketplace_live.py
      - name: Fresh official Tradera auctions and ECB currency check
        run: python tradera_daily_digest.py
      - name: Save dated read-only shortlist (never sends Discord)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tradera-daily-auctions
          path: tradera_daily_digest.json
          retention-days: 14
