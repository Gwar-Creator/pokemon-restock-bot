name: MasterBot Workflow Watchdog

on:
  schedule:
    # Independent from Restock and HOT. Times are UTC; schedules can be delayed.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Skriv kun ved ny fejl/genoprettelse i GitHub issue #62"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "tools/workflow_watchdog.py"
      - "test_workflow_watchdog.py"
      - ".github/workflows/workflow_watchdog.yml"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: masterbot-workflow-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install minimal dependency
        run: python -m pip install -q requests
      - name: Compile and run offline safety tests
        run: |
          python -m py_compile tools/workflow_watchdog.py test_workflow_watchdog.py
          python -m unittest -v test_workflow_watchdog.py
      - name: Read-only live workflow check
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.notify != true)
        run: python tools/workflow_watchdog.py
      - name: Scheduled incident-only notification
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify == true)
        run: python tools/workflow_watchdog.py --notify
