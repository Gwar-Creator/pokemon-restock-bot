name: TCGBruus public coverage diagnostic

on:
  pull_request:
    paths:
      - "tools/diagnostics/tcgbruus_coverage_probe.py"
      - ".github/workflows/tcgbruus_coverage_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install public HTTP dependencies only
        run: python -m pip install -q beautifulsoup4 curl_cffi
      - name: Check syntax
        run: python -m py_compile tools/diagnostics/tcgbruus_coverage_probe.py
      - name: Probe public category once (no secrets, no alerts)
        run: python tools/diagnostics/tcgbruus_coverage_probe.py
