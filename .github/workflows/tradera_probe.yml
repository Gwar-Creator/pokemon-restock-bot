name: Tradera API read-only probe

on:
  # The initial merge runs a single, guarded diagnostic request.
  # Later edits to Python/test files do not trigger another live request.
  push:
    branches: [main]
    paths:
      - ".github/workflows/tradera_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradera-one-shot-probe
  cancel-in-progress: false

jobs:
  inspect-search-response:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Validate local tests first
        run: |
          python -m py_compile vintage_tradera_probe.py test_vintage_tradera_probe.py
          python -m unittest -q test_vintage_tradera_probe.py
          python -m unittest -q test_vintage_finder_tradera.py

      - name: One read-only search and safe schema audit
        run: python vintage_tradera_probe.py
