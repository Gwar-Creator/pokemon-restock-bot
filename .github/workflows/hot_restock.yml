name: Pokemon HOT Restock

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Pokemon Restock Bot"
    types:
      - requested
  push:
    paths:
      - "hot_restock.py"
      - "salling_victini_watch.py"
      - "salling_early_radar.py"
      - ".github/workflows/hot_restock.yml"

permissions:
  contents: write

concurrency:
  group: pokemon-hot-restock
  cancel-in-progress: false

jobs:
  hot-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate HOT scanner and Salling watchers
        run: |
          python -m py_compile hot_restock.py salling_victini_watch.py salling_early_radar.py
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('hot_restock.py').read_text(encoding='utf-8')
          module = ast.parse(source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'hot_product_allowed' for node in module.body)

          watcher_source = Path('salling_victini_watch.py').read_text(encoding='utf-8')
          watcher_module = ast.parse(watcher_source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'fetch_target' for node in watcher_module.body)

          radar_source = Path('salling_early_radar.py').read_text(encoding='utf-8')
          radar_module = ast.parse(radar_source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'fetch_hidden_catalog' for node in radar_module.body)
          print('HOT scanner + Victini watcher + Early Radar syntax OK')
          PY

      - name: Run HOT lane + Salling early watches
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HOT_ITERATIONS: "5"
          HOT_INTERVAL_SECONDS: "60"
        run: |
          (
            for iteration in 1 2 3 4 5; do
              echo "SALLING early scan $iteration/5"

              if ! python salling_victini_watch.py; then
                echo "::warning::Victini watcher failed transiently on iteration $iteration; HOT run continues"
              fi

              if ! python salling_early_radar.py; then
                echo "::warning::Salling Early Radar failed transiently on iteration $iteration; HOT run continues"
              fi

              if [ "$iteration" -lt 5 ]; then
                sleep 60
              fi
            done
          ) &
          SALLING_PID=$!

          python hot_restock.py

          if ! wait "$SALLING_PID"; then
            echo "::warning::Salling background watcher exited non-zero; HOT scanner itself completed"
          fi

      - name: Save HOT + Salling states
        run: |
          if [ ! -f hot_restock_state.json ]; then
            echo "No HOT state produced."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hot_restock_state.json
          if [ -f salling_victini_state.json ]; then
            git add salling_victini_state.json
          fi
          if [ -f salling_early_radar_state.json ]; then
            git add salling_early_radar_state.json
          fi

          if git diff --cached --quiet; then
            echo "HOT/Salling state unchanged."
            exit 0
          fi

          git commit -m "Update hot restock and Salling radar state"

          for attempt in 1 2 3 4 5; do
            echo "HOT/Salling state push attempt $attempt/5"
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "HOT/Salling state pushed successfully."
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push HOT/Salling state after 5 attempts."
          exit 1
