name: Pokemon HOT Restock

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Pokemon Restock Bot"
    types:
      - requested
  push:
    paths:
      - "alert_policy.py"
      - "hot_restock.py"
      - "state_commit_guard.py"
      - "salling_early_radar.py"
      - "salling_early_radar_runner.py"
      - ".github/workflows/hot_restock.yml"

permissions:
  contents: write

concurrency:
  group: pokemon-hot-restock
  cancel-in-progress: false

jobs:
  hot-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Tier A HOT scanner and Salling Early Radar
        run: |
          python -m py_compile alert_policy.py hot_restock.py salling_early_radar.py salling_early_radar_runner.py state_commit_guard.py
          python -m unittest test_state_commit_guard.py test_alert_policy_v2.py
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('hot_restock.py').read_text(encoding='utf-8')
          module = ast.parse(source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'filter_hot_products' for node in module.body)
          assert 'hot_product_allowed' not in source
          assert 'coolshop' in source

          radar_source = Path('salling_early_radar.py').read_text(encoding='utf-8')
          radar_module = ast.parse(radar_source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'fetch_hidden_catalog' for node in radar_module.body)

          runner_source = Path('salling_early_radar_runner.py').read_text(encoding='utf-8')
          runner_module = ast.parse(runner_source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'ignore_epoch_only_change' for node in runner_module.body)
          print('Tier A HOT scanner + Early Radar syntax OK')
          PY

      - name: Run Tier A HOT lane + Salling Early Radar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HOT_ITERATIONS: "5"
          HOT_INTERVAL_SECONDS: "55"
        run: |
          (
            for iteration in 1 2 3 4 5; do
              echo "SALLING Early Radar scan $iteration/5"

              if ! python salling_early_radar_runner.py; then
                echo "::warning::Salling Early Radar failed transiently on iteration $iteration; HOT run continues"
              fi

              if [ "$iteration" -lt 5 ]; then
                sleep 55
              fi
            done
          ) &
          SALLING_PID=$!

          python hot_restock.py

          if ! wait "$SALLING_PID"; then
            echo "::warning::Salling Early Radar background watcher exited non-zero; HOT scanner itself completed"
          fi

      - name: Compact volatile state fields
        run: python state_commit_guard.py --profile hot

      - name: Save HOT + Salling Early Radar states
        run: |
          if [ ! -f hot_restock_state.json ]; then
            echo "No HOT state produced."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_BACKUP="$(mktemp -d)"
          cp hot_restock_state.json "$STATE_BACKUP/hot_restock_state.json"
          if [ -f salling_early_radar_state.json ]; then
            cp salling_early_radar_state.json "$STATE_BACKUP/salling_early_radar_state.json"
          fi

          for attempt in 1 2 3 4 5; do
            echo "HOT/Salling state push attempt $attempt/5"

            git fetch origin main
            git reset --hard origin/main

            cp "$STATE_BACKUP/hot_restock_state.json" hot_restock_state.json
            if [ -f "$STATE_BACKUP/salling_early_radar_state.json" ]; then
              cp "$STATE_BACKUP/salling_early_radar_state.json" salling_early_radar_state.json
            fi

            git add hot_restock_state.json
            if [ -f salling_early_radar_state.json ]; then
              git add salling_early_radar_state.json
            fi

            if git diff --cached --quiet; then
              echo "HOT/Salling state already current on main."
              rm -rf "$STATE_BACKUP"
              exit 0
            fi

            git commit -m "Update hot restock and Salling radar state"

            if git push origin HEAD:main; then
              echo "HOT/Salling state pushed successfully."
              rm -rf "$STATE_BACKUP"
              exit 0
            fi

            echo "Push raced with another workflow; retrying from latest main."
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done

          rm -rf "$STATE_BACKUP"
          echo "Failed to push HOT/Salling state after 5 fresh-main attempts."
          exit 1
