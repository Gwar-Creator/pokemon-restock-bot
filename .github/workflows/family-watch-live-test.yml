name: Family Watch Live Verification

on:
  push:
    paths:
      - ".github/workflows/family-watch-live-test.yml"

permissions:
  contents: write

concurrency:
  group: family-watch-live-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Family Watch
        run: |
          python -m py_compile family_watch.py
          python -m unittest test_family_watch.py

      - name: Verify webhook secret and Discord delivery
        env:
          FAMILY_WATCH_WEBHOOK_URL: ${{ secrets.FAMILY_WATCH_WEBHOOK_URL }}
        run: |
          if [ -z "$FAMILY_WATCH_WEBHOOK_URL" ]; then
            echo "::error::FAMILY_WATCH_WEBHOOK_URL is missing"
            exit 1
          fi
          python - <<'PY'
          import os
          import requests
          url = os.environ["FAMILY_WATCH_WEBHOOK_URL"]
          r = requests.post(url, json={"content": "✅ Family Watch live-test OK — webhook og GitHub secret virker."}, timeout=20)
          r.raise_for_status()
          print("Discord webhook delivery succeeded")
          PY

      - name: Run Family Watch in production mode
        env:
          FAMILY_WATCH_WEBHOOK_URL: ${{ secrets.FAMILY_WATCH_WEBHOOK_URL }}
          FAMILY_WATCH_DRY_RUN: "0"
        run: python family_watch.py

      - name: Save Family Watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f family_watch_state.json ]; then
            git add -- family_watch_state.json
          fi
          if git diff --cached --quiet; then
            echo "No Family Watch state changes to save."
            exit 0
          fi
          git commit -m "Update Family Watch state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
