name: Family Watch Email Digest (PAUSED - preview only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-watch-email
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate email digest
        run: |
          python -m py_compile family_watch_email_digest.py
          python -m unittest test_family_watch_email_digest.py

      - name: Build preview only
        env:
          FAMILY_WATCH_EMAIL_DRY_RUN: "true"
        run: python family_watch_email_digest.py
