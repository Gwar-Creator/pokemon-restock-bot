name: Pokemon Restock Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # workflow_dispatch may wait behind the previous scan. Resolve main
          # when the job actually starts instead of checking out its stale event SHA.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply one-time patches
        run: |
          if [ -f patch_v17_pricewatch.py ]; then
            python patch_v17_pricewatch.py
          fi
          if [ -f patch_v17_finalize.py ]; then
            python patch_v17_finalize.py
          fi
          if [ -f patch_v18_no_price_rises.py ]; then
            python patch_v18_no_price_rises.py
          fi
          if [ -f patch_v19_sources.py ]; then
            python patch_v19_sources.py
          fi
          if [ -f patch_v20_proshop_reader.py ]; then
            python patch_v20_proshop_reader.py
          fi
          if [ -f patch_v21_cleanup_price_history_log.py ]; then
            python patch_v21_cleanup_price_history_log.py
          fi
          if [ -f patch_v22_proshop_filter.py ]; then
            python patch_v22_proshop_filter.py
          fi
          if [ -f patch_v23_signal_cleanup.py ]; then
            python patch_v23_signal_cleanup.py
          fi
          if [ -f patch_v25_retailer_cleanup.py ]; then
            python patch_v25_retailer_cleanup.py
          fi
          if [ -f patch_v26_english_only.py ]; then
            python patch_v26_english_only.py
          fi
          if [ -f patch_v27_compact_price_history.py ]; then
            python patch_v27_compact_price_history.py
          fi
          if [ -f patch_v28_wave1_retailers.py ]; then
            python patch_v28_wave1_retailers.py
          fi
          if [ -f patch_v29_wave2_retailers.py ]; then
            python patch_v29_wave2_retailers.py
          fi
          if [ -f patch_v30_retire_cardstorecph.py ]; then
            python patch_v30_retire_cardstorecph.py
          fi
          if [ -f patch_v31_wave3_retailers.py ]; then
            python patch_v31_wave3_retailers.py
          fi
          if [ -f patch_v33_wave3_source_fixes.py ]; then
            python patch_v33_wave3_source_fixes.py
          fi
          if [ -f patch_v34_kocardz_anchor_parser.py ]; then
            python patch_v34_kocardz_anchor_parser.py
          fi
          if [ -f patch_v35_wave4_retailers.py ]; then
            python patch_v35_wave4_retailers.py
          fi
          if [ -f patch_v36_wave4_html_fallbacks.py ]; then
            python patch_v36_wave4_html_fallbacks.py
          fi
          if [ -f patch_v37_tcgbruus_browser_parser.py ]; then
            python patch_v37_tcgbruus_browser_parser.py
          fi
          if [ -f patch_v38_wave5_retailers.py ]; then
            python patch_v38_wave5_retailers.py
          fi
          if [ -f patch_v38_wave5_docs.py ]; then
            python patch_v38_wave5_docs.py
          fi
          if [ -f patch_v39_wave5_source_fixes.py ]; then
            python patch_v39_wave5_source_fixes.py
          fi
          if [ -f patch_v40_repair.py ]; then
            python patch_v40_repair.py
          fi
          if [ -f patch_v40_matching_opportunity.py ]; then
            python patch_v40_matching_opportunity.py
          fi
          if [ -f patch_v41_v40_runtime_fix.py ]; then
            python patch_v41_v40_runtime_fix.py
          fi
          if [ -f patch_v42_kelz0r_stability.py ]; then
            python patch_v42_kelz0r_stability.py
          fi
          if [ -f patch_v43_restock_sanitation.py ]; then
            python patch_v43_restock_sanitation.py
          fi
          if [ -f patch_v44_replay_guard.py ]; then
            python patch_v44_replay_guard.py
          fi
          if [ -f patch_v45_salling_discovery.py ]; then
            python patch_v45_salling_discovery.py
          fi
          if [ -f patch_v46_unified_abundant_set_policy.py ]; then
            python patch_v46_unified_abundant_set_policy.py
          fi
          if [ -f patch_v47_matraws_single_guard.py ]; then
            python patch_v47_matraws_single_guard.py
          fi

      - name: Validate Python
        run: |
          python -m py_compile restock_bot_github.py
          python -m py_compile local_stock_watch.py
          python -m py_compile scanner_health_audit.py
          python -m py_compile discord_cleanup.py
          python -m py_compile market_radar.py
          python -m unittest test_market_radar.py
          python -m unittest test_discord_cleanup.py
          python -m unittest test_alert_policy.py
          python -m py_compile retailer_probe_v24.py
          python -m py_compile preview_price_channels_v25.py
          python -m py_compile patch_v43_restock_sanitation.py
          python -m py_compile patch_v44_replay_guard.py
          python -m py_compile patch_v45_salling_discovery.py
          python -m py_compile patch_v46_unified_abundant_set_policy.py
          python -m py_compile patch_v47_matraws_single_guard.py
          python -m unittest test_matraws_single_guard.py

      - name: Keep Discord channels fresh
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RESTOCK_CHANNEL_ID: ${{ secrets.RESTOCK_CHANNEL_ID }}
          PRICE_WATCH_CHANNEL_ID: ${{ secrets.PRICE_WATCH_CHANNEL_ID }}
          PRICE_HISTORY_CHANNEL_ID: ${{ secrets.PRICE_HISTORY_CHANNEL_ID }}
          CARDMARKET_CHANNEL_ID: ${{ secrets.CARDMARKET_CHANNEL_ID }}
          DISCORD_RETENTION_HOURS: "24"
        run: python discord_cleanup.py

      - name: Run one-time retailer path probe V24
        if: ${{ hashFiles('retailer_probe_v24_done.json') == '' }}
        run: |
          python retailer_probe_v24.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('retailer_probe_v24_done.json', 'w', encoding='utf-8') as f:
              json.dump({'completed_at': datetime.now(timezone.utc).isoformat()}, f, indent=2)
          PY

      - name: Run restock + Local Stock in parallel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_WATCH_WEBHOOK_URL: ${{ secrets.PRICE_WATCH_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          SCANNER_HEALTH_WEBHOOK_URL: ${{ secrets.SCANNER_HEALTH_WEBHOOK_URL }}
          RUN_ONCE: "1"
        run: |
          set +e
          python restock_bot_github.py &
          RESTOCK_PID=$!
          python local_stock_watch.py &
          LOCAL_STOCK_PID=$!

          wait "$RESTOCK_PID"
          RESTOCK_STATUS=$?
          wait "$LOCAL_STOCK_PID"
          LOCAL_STOCK_STATUS=$?
          set -e

          if [ "$LOCAL_STOCK_STATUS" -ne 0 ]; then
            echo "::warning::Local Stock Watch exited with status $LOCAL_STOCK_STATUS; main restock state is still saved"
          fi

          if [ "$RESTOCK_STATUS" -ne 0 ]; then
            echo "::error::Main restock scan exited with status $RESTOCK_STATUS"
            exit "$RESTOCK_STATUS"
          fi

      - name: Run daily Market Radar
        continue-on-error: true
        env:
          MARKET_RADAR_WEBHOOK_URL: ${{ secrets.MARKET_RADAR_WEBHOOK_URL }}
          MARKET_RADAR_FORCE_RUN: "0"
          MARKET_RADAR_SHADOW: "0"
        run: python market_radar.py

      - name: Generate one-time V25 price channel preview
        if: ${{ hashFiles('price_channels_preview_v25_done.json') == '' }}
        run: |
          python preview_price_channels_v25.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('price_channels_preview_v25_done.json', 'w', encoding='utf-8') as f:
              json.dump({'completed_at': datetime.now(timezone.utc).isoformat()}, f, indent=2)
          PY

      - name: Audit scanner health
        continue-on-error: true
        run: python scanner_health_audit.py

      - name: Save updated state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update restock and market state"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            git rebase --abort || true

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push after 3 attempts."
          exit 1