name: Pokemon Restock Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # workflow_dispatch may wait behind the previous scan. Resolve main
          # when the job actually starts instead of checking out its stale event SHA.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate production scanner
        run: |
          python -m py_compile restock_bot_github.py
          python -m py_compile local_stock_watch.py
          python -m py_compile scanner_health_audit.py
          python -m py_compile discord_cleanup.py
          python -m py_compile state_commit_guard.py
          python -m unittest test_discord_cleanup.py
          python -m unittest test_alert_policy.py
          python -m unittest test_matraws_single_guard.py
          python -m unittest test_state_commit_guard.py

      - name: Keep Discord channels fresh
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RESTOCK_CHANNEL_ID: ${{ secrets.RESTOCK_CHANNEL_ID }}
          PRICE_WATCH_CHANNEL_ID: ${{ secrets.PRICE_WATCH_CHANNEL_ID }}
          PRICE_HISTORY_CHANNEL_ID: ${{ secrets.PRICE_HISTORY_CHANNEL_ID }}
          CARDMARKET_CHANNEL_ID: ${{ secrets.CARDMARKET_CHANNEL_ID }}
          DISCORD_RETENTION_HOURS: "24"
        run: python discord_cleanup.py

      - name: Run restock + Local Stock in parallel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_WATCH_WEBHOOK_URL: ${{ secrets.PRICE_WATCH_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          RUN_ONCE: "1"
        run: |
          set +e
          python restock_bot_github.py &
          RESTOCK_PID=$!
          python local_stock_watch.py &
          LOCAL_STOCK_PID=$!

          wait "$RESTOCK_PID"
          RESTOCK_STATUS=$?
          wait "$LOCAL_STOCK_PID"
          LOCAL_STOCK_STATUS=$?
          set -e

          if [ "$LOCAL_STOCK_STATUS" -ne 0 ]; then
            echo "::warning::Local Stock Watch exited with status $LOCAL_STOCK_STATUS; main restock state is still saved"
          fi

          if [ "$RESTOCK_STATUS" -ne 0 ]; then
            echo "::error::Main restock scan exited with status $RESTOCK_STATUS"
            exit "$RESTOCK_STATUS"
          fi

      - name: Audit scanner health (Actions only)
        continue-on-error: true
        run: python scanner_health_audit.py

      - name: Compact volatile state fields
        run: python state_commit_guard.py --profile main

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only production-owned state/audit files may be committed. This
          # deliberately replaces the old `git add -A` behavior.
          git add -- \
            restock_state_v2.json \
            local_stock_state_v1.json \
            price_matching_audit_v1.json

          if git diff --cached --quiet; then
            echo "No production state changes to save."
            exit 0
          fi

          git commit -m "Update restock state"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            git rebase --abort || true

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push after 3 attempts."
          exit 1
