name: Pokemon Restock Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile restock_bot_github.py
          python -m py_compile cardmarket_chase_watch.py
          if [ -f cardmarket_v16_replay.py ]; then
            python -m py_compile cardmarket_v16_replay.py
          fi

      - name: Run one restock scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_WATCH_WEBHOOK_URL: ${{ secrets.PRICE_WATCH_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          RUN_ONCE: "1"
        run: python restock_bot_github.py

      - name: Run daily Card Market Watch
        continue-on-error: true
        env:
          TCG_CARDMARKET_API_KEY: ${{ secrets.TCG_CARDMARKET_API_KEY }}
          CARDMARKET_WEBHOOK_URL: ${{ secrets.CARDMARKET_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          CARDMARKET_TIMEZONE: "Europe/Copenhagen"
          CARDMARKET_DAILY_HOUR: "8"
        run: |
          if [ -f cardmarket_v16_replay.py ]; then
            python cardmarket_v16_replay.py
          fi
          python cardmarket_chase_watch.py

      - name: Save updated state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update restock and market state"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            git rebase --abort || true

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push after 3 attempts."
          exit 1
