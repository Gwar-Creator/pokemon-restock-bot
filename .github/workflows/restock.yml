name: Pokemon Restock Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply one-time patches
        run: |
          if [ -f patch_v17_pricewatch.py ]; then
            python patch_v17_pricewatch.py
          fi
          if [ -f patch_v17_finalize.py ]; then
            python patch_v17_finalize.py
          fi
          if [ -f patch_v18_no_price_rises.py ]; then
            python patch_v18_no_price_rises.py
          fi
          if [ -f patch_v19_sources.py ]; then
            python patch_v19_sources.py
          fi
          if [ -f patch_v20_proshop_reader.py ]; then
            python patch_v20_proshop_reader.py
          fi
          if [ -f patch_v21_cleanup_price_history_log.py ]; then
            python patch_v21_cleanup_price_history_log.py
          fi
          if [ -f patch_v22_proshop_filter.py ]; then
            python patch_v22_proshop_filter.py
          fi
          if [ -f patch_v23_signal_cleanup.py ]; then
            python patch_v23_signal_cleanup.py
          fi
          if [ -f patch_v25_retailer_cleanup.py ]; then
            python patch_v25_retailer_cleanup.py
          fi
          if [ -f patch_v26_english_only.py ]; then
            python patch_v26_english_only.py
          fi
          if [ -f patch_v27_compact_price_history.py ]; then
            python patch_v27_compact_price_history.py
          fi
          if [ -f patch_v28_wave1_retailers.py ]; then
            python patch_v28_wave1_retailers.py
          fi
          if [ -f patch_v29_wave2_retailers.py ]; then
            python patch_v29_wave2_retailers.py
          fi
          if [ -f patch_v30_retire_cardstorecph.py ]; then
            python patch_v30_retire_cardstorecph.py
          fi
          if [ -f patch_v31_wave3_retailers.py ]; then
            python patch_v31_wave3_retailers.py
          fi
          if [ -f patch_v33_wave3_source_fixes.py ]; then
            python patch_v33_wave3_source_fixes.py
          fi
          if [ -f patch_v34_kocardz_anchor_parser.py ]; then
            python patch_v34_kocardz_anchor_parser.py
          fi
          if [ -f patch_v35_wave4_retailers.py ]; then
            python patch_v35_wave4_retailers.py
          fi
          if [ -f patch_v36_wave4_html_fallbacks.py ]; then
            python patch_v36_wave4_html_fallbacks.py
          fi
          if [ -f patch_v37_tcgbruus_browser_parser.py ]; then
            python patch_v37_tcgbruus_browser_parser.py
          fi
          if [ -f patch_v38_wave5_retailers.py ]; then
            python patch_v38_wave5_retailers.py
          fi
          if [ -f patch_v38_wave5_docs.py ]; then
            python patch_v38_wave5_docs.py
          fi
          if [ -f patch_v39_wave5_source_fixes.py ]; then
            python patch_v39_wave5_source_fixes.py
          fi

      - name: Validate Python
        run: |
          python -m py_compile restock_bot_github.py
          python -m py_compile local_stock_watch.py
          python -m py_compile scanner_health_audit.py
          python -m py_compile cardmarket_chase_watch.py
          python -m py_compile retailer_probe_v24.py
          python -m py_compile preview_price_channels_v25.py
          if [ -f cardmarket_v16_replay.py ]; then
            python -m py_compile cardmarket_v16_replay.py
          fi

      - name: Run one-time retailer path probe V24
        if: ${{ hashFiles('retailer_probe_v24_done.json') == '' }}
        run: |
          python retailer_probe_v24.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('retailer_probe_v24_done.json', 'w', encoding='utf-8') as f:
              json.dump({'completed_at': datetime.now(timezone.utc).isoformat()}, f, indent=2)
          PY

      - name: Run one restock scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_WATCH_WEBHOOK_URL: ${{ secrets.PRICE_WATCH_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          RUN_ONCE: "1"
        run: python restock_bot_github.py

      - name: Generate one-time V25 price channel preview
        if: ${{ hashFiles('price_channels_preview_v25_done.json') == '' }}
        run: |
          python preview_price_channels_v25.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('price_channels_preview_v25_done.json', 'w', encoding='utf-8') as f:
              json.dump({'completed_at': datetime.now(timezone.utc).isoformat()}, f, indent=2)
          PY

      - name: Run Local Stock Watch
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python local_stock_watch.py

      - name: Audit scanner health
        continue-on-error: true
        run: python scanner_health_audit.py

      - name: Run daily Card Market Watch
        continue-on-error: true
        env:
          TCG_CARDMARKET_API_KEY: ${{ secrets.TCG_CARDMARKET_API_KEY }}
          CARDMARKET_WEBHOOK_URL: ${{ secrets.CARDMARKET_WEBHOOK_URL }}
          PRICE_HISTORY_WEBHOOK_URL: ${{ secrets.PRICE_HISTORY_WEBHOOK_URL }}
          CARDMARKET_TIMEZONE: "Europe/Copenhagen"
          CARDMARKET_DAILY_HOUR: "8"
          CARDMARKET_MAX_DAILY_REQUESTS: "98"
          CARDMARKET_ROTATION_DAYS: "3"
        run: |
          if [ -f cardmarket_v16_replay.py ]; then
            python cardmarket_v16_replay.py
          fi
          python cardmarket_chase_watch.py

      - name: Save updated state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update restock and market state"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            git rebase --abort || true

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Failed to push after 3 attempts."
          exit 1
